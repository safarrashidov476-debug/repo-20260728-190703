name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Code Quality Check (Lint)
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew lintDebug --no-daemon || echo "Lint xatoliklar topdi, lekin build davom etadi"
          else
            gradle lintDebug --no-daemon || echo "Lint xatoliklar topdi, lekin build davom etadi"
          fi

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew || echo "gradlew topilmadi, tizimdagi gradle ishlatiladi"
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            **/build/outputs/apk/**/*.apk
